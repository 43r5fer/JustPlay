name: Build JustPlay v0.1.1 auth diagnostics hotfix

on:
  push:
    branches: [main]
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustPlay-Windows-Installer-v0.1.1
          path: dist/JustPlay.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish v0.1.1 Release
        uses: softprops/action-gh-release@v2
        with:
          name: JustPlay v0.1.1
          tag_name: v0.1.1
          target_commitish: main
          generate_release_notes: true
          files: dist/JustPlay.exe
