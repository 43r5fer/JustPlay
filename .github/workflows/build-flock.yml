name: Build and release Flock for Windows and Android

on:
  push:
    tags:
      - "v*"
      - "flock-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows setup
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Build Flock Setup
        run: npm run dist:win

      - name: Create updater manifest
        run: node scripts/write-update-manifest.cjs

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Flock-Windows-Release
          path: |
            dist/Flock-Setup.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK and Play Store bundle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install project dependencies
        run: npm install

      - name: Copy shared Flock UI into the mobile app
        run: npm run mobile:prepare

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Add camera and microphone permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Sync web assets and native plugins
        run: npx cap sync android

      - name: Re-apply media permissions after sync
        run: node scripts/patch-android-manifest.mjs

      - name: Configure protected Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/flock-upload.jks
            test -s android/app/flock-upload.jks
            {
              echo "FLOCK_RELEASE_SIGNING_READY=true"
              echo "FLOCK_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/flock-upload.jks"
            } >> "$GITHUB_ENV"
            echo "Release signing is configured. A signed AAB and APK will be built."
          else
            echo "FLOCK_RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Android release signing secrets are missing. A debug APK will be built; the Play Store App Bundle will be skipped."
          fi

      - name: Configure version, API 36 and Google Play update support
        run: node scripts/patch-android-release.mjs

      - name: Build Android APK and optional signed Play Store bundle
        shell: bash
        run: |
          mkdir -p dist
          cd android
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Flock-debug.apk
          if [ "$FLOCK_RELEASE_SIGNING_READY" = "true" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/Flock.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist/Flock-Play-Store.aab
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/Flock.apk
          fi

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flock-Android-Release
          path: |
            dist/Flock.apk
            dist/Flock-debug.apk
            dist/Flock-Play-Store.aab
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish Flock release assets
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/flock-v')
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows, APK and optional Play Store bundle
        uses: actions/download-artifact@v4
        with:
          pattern: Flock-*-Release
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flock ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*
