name: Build and release Clines for Windows and Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "flock-v*"
      - "clines-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows setup
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish Clines v')) || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Build Clines Setup
        run: npm run dist:win

      - name: Create updater manifest
        run: node scripts/write-update-manifest.cjs

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Clines-Windows-Release
          path: |
            dist/Clines-Setup.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK for direct distribution
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish Clines v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install project dependencies
        run: npm install

      - name: Copy shared Clines UI into the mobile app
        run: npm run mobile:prepare

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Add camera and microphone permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Sync web assets and native plugins
        run: npx cap sync android

      - name: Re-apply media permissions after sync
        run: node scripts/patch-android-manifest.mjs

      - name: Add Android in-app updater and notifications
        run: node scripts/patch-android-updater.mjs

      - name: Configure protected Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/flock-upload.jks
            test -s android/app/flock-upload.jks
            {
              echo "FLOCK_RELEASE_SIGNING_READY=true"
              echo "FLOCK_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/flock-upload.jks"
            } >> "$GITHUB_ENV"
            echo "Release signing is configured. A release-signed APK will be built."
          else
            echo "FLOCK_RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Android signing secrets are missing. A functional debug-signed APK will be built; future in-place updates may require a reinstall."
          fi

      - name: Configure Android version, API 36 and direct APK update support
        run: node scripts/patch-android-release.mjs

      - name: Build direct-download Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p dist
          cd android
          if [ "$FLOCK_RELEASE_SIGNING_READY" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/Clines.apk
            echo "Built a release-signed sideload APK for direct download."
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/Clines.apk
            echo "::warning::No stable APK signing key configured; Clines.apk is functional but future in-place APK updates may require reinstalling."
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Clines-Android-Release
          path: dist/Clines.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Clines release assets
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/flock-v') || startsWith(github.ref, 'refs/tags/clines-v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish Clines v')) || github.event_name == 'workflow_dispatch'
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@v4

      - name: Read application version
        id: app-version
        shell: bash
        run: echo version=$(node -p "require('./package.json').version") >> "$GITHUB_OUTPUT"

      - name: Download Windows and direct-download APK
        uses: actions/download-artifact@v4
        with:
          pattern: Clines-*-Release
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Clines v${{ steps.app-version.outputs.version }}
          tag_name: clines-v${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-files/*
