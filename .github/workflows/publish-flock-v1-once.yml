name: Publish Flock v1.0.0 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-flock-v1-once.yml"

permissions:
  contents: write

jobs:
  windows:
    if: contains(github.event.head_commit.message, 'Trigger Flock v1.0.0 release build')
    name: Build Windows setup
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Build Flock Setup
        run: npm run dist:win
      - name: Create updater manifest
        run: node scripts/write-update-manifest.cjs
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Flock-Windows-Release
          path: |
            dist/Flock-Setup.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  android:
    if: contains(github.event.head_commit.message, 'Trigger Flock v1.0.0 release build')
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install project dependencies
        run: npm install
      - name: Copy shared Flock UI into the mobile app
        run: npm run mobile:prepare
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Add camera and microphone permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Sync web assets and native plugins
        run: npx cap sync android
      - name: Re-apply media permissions after sync
        run: node scripts/patch-android-manifest.mjs
      - name: Build installable Android APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Flock.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Flock-Android-Release
          path: dist/Flock.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: contains(github.event.head_commit.message, 'Trigger Flock v1.0.0 release build')
    name: Publish Flock release assets
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and Android builds
        uses: actions/download-artifact@v4
        with:
          pattern: Flock-*-Release
          path: release-files
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flock v1.0.0
          tag_name: flock-v1.0.0
          target_commitish: main
          generate_release_notes: true
          files: |
            release-files/Flock-Setup.exe
            release-files/Flock.apk
            release-files/latest.yml
