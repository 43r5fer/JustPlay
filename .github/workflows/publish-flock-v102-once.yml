name: Publish Flock v1.0.2 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-flock-v102-once.yml"

permissions:
  contents: write

jobs:
  windows:
    if: contains(github.event.head_commit.message, 'Trigger Flock v1.0.2 release build')
    name: Build Windows setup
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Build Flock Setup
        run: npm run dist:win
      - name: Create updater manifest
        run: node scripts/write-update-manifest.cjs
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Flock-Windows-Release
          path: |
            dist/Flock-Setup.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  android:
    if: contains(github.event.head_commit.message, 'Trigger Flock v1.0.2 release build')
    name: Build Android APK and Play Store bundle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm install
      - name: Copy the web app into the Android wrapper
        run: npm run mobile:prepare
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Add camera and microphone permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Re-apply media permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Configure protected Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/flock-upload.jks
            test -s android/app/flock-upload.jks
            {
              echo "FLOCK_RELEASE_SIGNING_READY=true"
              echo "FLOCK_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/flock-upload.jks"
            } >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "FLOCK_RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets not configured. Building a testing APK; Play Store AAB skipped."
          fi
      - name: Configure Android version, API 36 and Google Play updates
        run: node scripts/patch-android-release.mjs
      - name: Build APK and optional signed App Bundle
        shell: bash
        run: |
          mkdir -p dist
          cd android
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Flock-debug.apk
          if [ "$FLOCK_RELEASE_SIGNING_READY" = "true" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/Flock.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist/Flock-Play-Store.aab
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/Flock.apk
          fi
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flock-Android-Release
          path: |
            dist/Flock.apk
            dist/Flock-debug.apk
            dist/Flock-Play-Store.aab
          if-no-files-found: warn
          retention-days: 30

  release:
    if: contains(github.event.head_commit.message, 'Trigger Flock v1.0.2 release build')
    name: Publish Flock release assets
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Flock-*-Release
          path: release-files
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flock v1.0.2
          tag_name: flock-v1.0.2
          target_commitish: main
          generate_release_notes: true
          files: release-files/*
