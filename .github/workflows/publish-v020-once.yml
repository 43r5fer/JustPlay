name: One-time release of JustPlay v0.2.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Publish JustPlay v0.2.0')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate update metadata
        run: node scripts/write-update-manifest.cjs

      - name: Publish version and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: main
          name: JustPlay v0.2.0
          generate_release_notes: false
          files: |
            dist/JustPlay.exe
            dist/latest.yml
          body: |
            ## What's new in JustPlay v0.2.0
            - In-app update checks, download progress and restart-to-install.
            - A What's New release-notes section in the launcher Docs page.
            - Optional local JustPlay launcher accounts, separate from Minecraft authentication.
            - SHA-512 metadata for the update installer.

            **Users on v0.1.1:** install v0.2.0 once from this release. Later updates can be offered inside JustPlay.
