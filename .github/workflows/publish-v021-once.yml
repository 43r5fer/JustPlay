name: One-time release of JustPlay v0.2.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Publish JustPlay v0.2.1')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate update metadata
        run: node scripts/write-update-manifest.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustPlay-Windows-Installer-v0.2.1
          path: |
            dist/JustPlay.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish version and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          target_commitish: main
          name: JustPlay v0.2.1
          generate_release_notes: false
          files: |
            dist/JustPlay.exe
            dist/latest.yml
          body: |
            ## What's new in JustPlay v0.2.1
            - Dedicated JustPlay username/password welcome screen.
            - Guest mode for entering the launcher without a local account.
            - Clear separation between local JustPlay profiles and Microsoft Minecraft authentication.
            - Existing in-app update checker remains enabled for future updates.

            A local JustPlay account does not grant Minecraft entitlement or bypass game-authentication checks.
