name: One-time release of JustPlay v0.2.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Publish JustPlay v0.2.2')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate update metadata
        run: node scripts/write-update-manifest.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustPlay-Windows-Installer-v0.2.2
          path: |
            dist/JustPlay.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish version and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          target_commitish: main
          name: JustPlay v0.2.2
          generate_release_notes: false
          files: |
            dist/JustPlay.exe
            dist/latest.yml
          body: |
            ## What's new in JustPlay v0.2.2
            - Auto-detect installed Java runtimes and select a compatible major version per Minecraft version.
            - Sync and preview the active skin of the currently authenticated Minecraft Java profile through the official profile service.
            - Offer saved-session play for already-installed profiles after a successful Microsoft/Minecraft authentication. The session is OS-encrypted, expires after 20 hours, and is deleted on explicit sign-out.
            - Require local client JAR, libraries and cached assets for saved-session launches; no fake tokens or auth-failure fallback are used.

            Saved-session play uses a previously successful official Minecraft authentication. It does not grant ownership to local JustPlay accounts.
