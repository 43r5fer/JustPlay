name: Publish JustPlay v0.3.1 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v031-once.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    if: contains(github.event.head_commit.message, 'Trigger v0.3.1 release build')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate update metadata
        run: node scripts/write-update-manifest.cjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustPlay-v0.3.1-Windows
          path: |
            dist/JustPlay.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JustPlay v0.3.1
          tag_name: v0.3.1
          target_commitish: main
          generate_release_notes: true
          files: |
            dist/JustPlay.exe
            dist/latest.yml
