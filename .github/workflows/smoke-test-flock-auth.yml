name: Temporary Flock auth smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test-flock-auth.yml"

permissions:
  contents: read

jobs:
  live-auth-smoke-test:
    if: contains(github.event.head_commit.message, 'Run Flock custom auth smoke test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate smoke-test script
        run: node --check scripts/smoke-test-flock-auth.mjs
      - name: Test live custom registration, friend code, login, remember session and logout
        run: node scripts/smoke-test-flock-auth.mjs
