name: Temporary Flock data API smoke test (two accounts)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test-flock-data-api.yml"

permissions:
  contents: read

jobs:
  live-data-api-smoke-test:
    if: contains(github.event.head_commit.message, 'Run Flock data API smoke test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate smoke-test script
        run: node --check scripts/smoke-test-flock-data-api.mjs
      - name: Test custom-session RLS, friend lookup and private storage
        run: node scripts/smoke-test-flock-data-api.mjs
