name: Validate Clines v1.0.4
on:
  push:
    branches:
      - clines-v1.0.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate app metadata
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='1.0.4'||p.build.productName!=='Clines') process.exit(1); JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); JSON.parse(require('fs').readFileSync('src/manifest.webmanifest','utf8'));"
      - name: Prepare Android web assets
        run: npm run mobile:prepare
