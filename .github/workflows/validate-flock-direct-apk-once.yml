name: Validate Flock direct APK build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-flock-direct-apk-once.yml"

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, 'Validate Flock direct APK workflow')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies and validate all scripts
        run: |
          npm install
          npm run check
      - name: Prepare mobile app
        run: npm run mobile:prepare
      - name: Generate Capacitor project
        run: npx cap add android
      - name: Add media permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Re-apply media permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Configure direct APK release metadata
        run: node scripts/patch-android-release.mjs
      - name: Compile Android APK
        run: cd android && ./gradlew --no-daemon assembleDebug
